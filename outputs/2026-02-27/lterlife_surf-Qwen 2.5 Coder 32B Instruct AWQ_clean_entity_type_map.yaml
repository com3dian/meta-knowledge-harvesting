  - Implements Directive 2007/2/EC concerning the interoperability of spatial data
    sets and services.
  System:
  - RijksWateren-EcotopenStelsel (RWES) defines and maps ecotopes in Dutch waters,
    particularly saltwater areas. Zoute wateren EcotopenStelsel is a subsystem of
    RWES for mapping ecotopes in saltwater environments in the Netherlands.
  Web Map Service:
  - Provides access to the ecotope map data for the Wadden Sea.
